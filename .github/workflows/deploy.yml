name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deploy hook secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi

      - name: Trigger Render deploy
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /tmp/render-response.txt
          cat /tmp/render-response.txt

  verify-backend:
    name: Verify backend health
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Wait for backend liveness
        run: |
          if [ -z "${{ secrets.RENDER_HEALTH_URL }}" ]; then
            echo "RENDER_HEALTH_URL not configured; skipping post-deploy health check"
            exit 0
          fi
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          echo "Checking $URL"
          for i in $(seq 1 20); do
            if curl -fsS "$URL" | grep -q '"status":"ok"'; then
              echo "Backend is live"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "Backend did not become healthy in time"
          exit 1

  # Vercel deploys automatically when connected to the main branch.
